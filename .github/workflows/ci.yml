# Contrôles de chaque pull request : types, lint, contenu, tests, build, tests dans le navigateur.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  controles:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Types
        run: npm run check
      - name: Lint et format
        run: npm run lint
      - name: Contenu
        run: npm run validate
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      # Navigateur : le Google Chrome déjà installé sur la machine de GitHub.
      - name: Tests dans le navigateur (parcours, accessibilité)
        run: npx playwright test
