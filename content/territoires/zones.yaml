# Zones de défense et de sécurité : code de la défense, article R*1211-4 (métropole, version en
# vigueur depuis le 14 avril 2021) et article R1211-8 (outre-mer, version en vigueur depuis le
# 24 février 2024). Relevé sur Légifrance le 11/11/2026, à vérifier sur le texte.
# Les zones de Nouvelle-Calédonie et de Polynésie française ne comptent aucun département :
# elles ne sont pas reprises dans cette version de la carte.
source_id: code-defense-zones
verifie_le: "2026-11-11"
verifie_par: arthurwelly
