id: cadre-organisation-ars
categorie: cadre
ordre: 10
enonce: "L'ARS organise l'urgence médico-psychologique. Une CUMP départementale est constituée dans chaque établissement siège de SAMU. Son champ : les victimes de catastrophes, d'accidents impliquant un grand nombre de victimes, ou d'événements susceptibles d'entraîner d'importantes répercussions psychologiques."
