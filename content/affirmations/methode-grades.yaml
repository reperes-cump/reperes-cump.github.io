ordre: 10
# Formulation relevée, à vérifier dans la section méthodologie de la recommandation :
#   Méthode HAS du consensus formalisé, cotation de 1 à 9.
#   Accord fort : médiane ≥ 7 et toutes les cotations entre 7 et 9.
#   Accord relatif : médiane ≥ 7 et toutes les cotations entre 5 et 9.
# Pour l'accord fort, la condition sur la médiane découle de l'autre : elle n'est pas répétée.
enonce: |-
  Les recommandations ont été votées par un groupe d'experts (méthode HAS du consensus formalisé). Chaque expert a noté chaque proposition de 1 à 9.

  Accord fort : toutes les notes sont entre 7 et 9.

  Accord relatif : toutes les notes sont entre 5 et 9, et la note médiane est d'au moins 7.
